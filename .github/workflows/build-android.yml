name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-classscanner/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-classscanner
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K12-ClassScanner-android-debug-apk
          path: android-classscanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14