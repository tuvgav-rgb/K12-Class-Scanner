name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'

jobs:
  build-dmg:
    name: Build ${{ matrix.name }} macOS DMG
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-13
            artifact: K12-ClassScanner-macos-x64-dmg
          - name: Apple Silicon
            runner: macos-14
            artifact: K12-ClassScanner-macos-arm64-dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: macos
        run: npm ci

      - name: Build Tauri application and DMG
        working-directory: macos
        run: npm run build:tauri

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: macos/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
